  .mn-rcpt-bot { display:grid; grid-template-columns:1fr 1fr; border-radius:0 0 22px 22px;

  .mn-slider::-webkit-slider-thumb { -webkit-appearance:none; width:28px; height:28px; margin-top:-9px; border-radius:50%;

            <div class="mn-ticks" aria-hidden="true"><span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span></div>
          </div>
        </div>
        <div class="mn-rcpt-bot" aria-live="polite">
          <div class="mn-stub you"><span>You keep</span><b class="js-keep">$18.00</b></div>
          <div class="mn-stub"><span>Vendor receives</span><b class="js-vendor">$102.00</b></div>
        </div>
      </div></div></figure></div>
</main>
<script>
  var ORDER = 120;
  function money(n) { return '$' + n.toFixed(2); }
  document.querySelectorAll('.cv').forEach(function (cv) {
    var card = cv.querySelector('.mn-rcpt'), top = cv.querySelector('.mn-rcpt-top'), range = cv.querySelector('.mn-slider');
    function size() { cv.style.setProperty('--cw', card.offsetWidth); cv.style.setProperty('--ch', card.offsetHeight); cv.style.setProperty('--th', top.offsetHeight); }
    function paint() {
      var pct = +range.value, yours = ORDER * pct / 100;
      cv.querySelector('.js-rate').textContent = pct + '%';
      cv.querySelector('.js-keep').textContent = money(yours);
      cv.querySelector('.js-vendor').textContent = money(ORDER - yours);
      range.style.setProperty('--fill', pct + '%');
    }
    range.addEventListener('input', paint); paint(); size();
    if ('ResizeObserver' in window) new ResizeObserver(size).observe(card);
  });
</script>
</body>
</html>
